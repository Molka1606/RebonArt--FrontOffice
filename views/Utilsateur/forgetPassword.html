<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Mot de passe oublié</title>
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>
    <div class="box">
        <div class="form-box">
            <form>
                <label for="motdepasse">Nouveau mot de passe :</label>
                <input type="password" id="motdepasse" name="motdepasse" placeholder="Entrez votre nouveau mot de passe" required>
                <label for="cmotdepasse">Confirmer le mot de passe : </label>
                <input type="password" id="cmotdepasse" name="cmotdepasse" placeholder="Confirmer votre nouveau mot de passe" required>
                <button type="submit"><a href="signIn.html">Confirmer</a></button>
            </form>
        </div>

        <div class="side-box">
            <div class="side">
                <button><a href="signUp.html">S'inscrire</a></button>
            </div>
        </div>
    </div>
</body>
</html>
